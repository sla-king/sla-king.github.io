<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>sla-king's Homepage</title>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <style>
        body {
            background-image: url('assets/bliss.jpg'); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #3a6ea5;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .window {
            width: 680px;
            position: absolute;
            top: calc(50vh - 195px);
            left: calc(50vw - 340px);
            background-color: #0831d9;
            box-sizing: border-box;
        }

        #draggable-window .window-body {
            background-color: #000000;
            height: 360px;
            margin: 0 3px;
            padding: 12px 8px 12px 12px;
            overflow-y: scroll;
            overflow-x: hidden;
            box-sizing: border-box;
            cursor: text;
        }

        #console-output {
            background-color: #000000;
            color: #c0c0c0;
            margin: 0;
            padding: 0;
            border: none;
            font-family: 'Lucida Console', 'Consolas', 'Courier New', monospace;
            font-size: 12px; 
            line-height: 1.2;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
        }

        .input-line {
            display: flex;
            align-items: flex-start;
            color: #c0c0c0;
            font-family: 'Lucida Console', 'Consolas', 'Courier New', monospace;
            font-size: 12px; 
            line-height: 1.2;
            height: 1.2em;
        }

        #prompt-text {
            white-space: pre;
            line-height: inherit;
        }

        #cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #c0c0c0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            padding: 0;
            margin: 0;
            height: 1.2em;
        }

        .title-bar-controls button[disabled] {
            opacity: 0.5;
            cursor: default;
        }
        
        #drag-outline {
            position: fixed;
            box-sizing: border-box;
            border: 1px dotted #ffffff;
            background: transparent;
            z-index: 9999;
            pointer-events: none;
            display: none;
            margin: 0;
            padding: 0;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(to bottom, #245edb 0%, #3f8cf3 9%, #245edb 18%, #245edb 92%, #1941a5 100%);
            display: flex;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -1px 2px rgba(0,0,0,0.3);
            font-family: 'Tahoma', sans-serif;
        }

        .start-button {
            height: 100%;
            padding: 0 16px;
            background: linear-gradient(to bottom, #3c8a0f 0%, #54b611 10%, #3c8a0f 50%, #2b660a 100%);
            border-radius: 0 10px 10px 0;
            display: flex;
            align-items: center;
            color: white;
            font-size: 15px;
            font-weight: bold;
            font-style: italic;
            text-shadow: 1px 1px 1px black;
            cursor: default;
            box-shadow: inset -1px 0px 1px rgba(255,255,255,0.4);
        }

        .taskbar-item {
            height: 22px;
            margin-left: 8px;
            padding: 0 8px;
            background: linear-gradient(to bottom, #3f8cf3 0%, #245edb 100%);
            border: 1px solid #1941a5;
            border-radius: 3px;
            display: flex;
            align-items: center;
            color: white;
            font-size: 11px;
            width: 160px;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
            outline: none;
            user-select: none;
        }

        .taskbar-item:hover {
            background: linear-gradient(to bottom, #5c9df5 0%, #3f8cf3 100%);
        }

        .taskbar-item.active {
            background: linear-gradient(to bottom, #2864d6 0%, #1b469c 100%);
            border-color: #12316c;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.4);
        }

        .taskbar-item.active:hover {
            background: linear-gradient(to bottom, #2864d6 0%, #1b469c 100%);
        }

        .system-tray {
            margin-left: auto;
            height: 100%;
            padding: 0 10px;
            background: linear-gradient(to bottom, #0f8bee 0%, #1290f5 9%, #0f8bee 18%, #0f8bee 92%, #084fb1 100%);
            display: flex;
            align-items: center;
            color: white;
            font-size: 11px;
            border-left: 1px solid #1941a5;
            box-shadow: inset 1px 0 2px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div id="drag-outline"></div>

    <div class="window" id="draggable-window">
        <div class="title-bar" id="title-bar">
            <div class="title-bar-text">Command Prompt</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize" id="btn-minimize"></button>
                <button aria-label="Maximize" disabled></button>
                <button aria-label="Close" id="btn-close"></button>
            </div>
        </div>
        <div class="window-body" id="console-body">
            <pre id="console-output">Microsoft Windows XP [Version 5.1.2600]
(C) Copyright 1985-2001 Microsoft Corp.

</pre>
            <div class="input-line">
                <span id="prompt-text">C:\Users\sla-king&gt;</span>
                <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-button">
            start
        </div>
        <div class="taskbar-item active" id="taskbar-app">
            Command Prompt
        </div>
        <div class="system-tray">
            <span id="clock">12:00 PM</span>
        </div>
    </div>

    <script>
        const win = document.getElementById("draggable-window");
        const titleBar = document.getElementById("title-bar");
        const outline = document.getElementById("drag-outline");
        const btnMinimize = document.getElementById("btn-minimize");
        const btnClose = document.getElementById("btn-close");
        const clock = document.getElementById("clock");
        const taskbarApp = document.getElementById("taskbar-app");
        const consoleBody = document.getElementById("console-body");
        const consoleOutput = document.getElementById("console-output");
        const cmdInput = document.getElementById("cmd-input");
        const promptText = document.getElementById("prompt-text");

        const initialText = "Microsoft Windows XP [Version 5.1.2600]\n(C) Copyright 1985-2001 Microsoft Corp.\n\n";

        let isDragging = false;
        let startX, startY;
        let winRect;

        function print(text) {
            consoleOutput.textContent += text + "\n";
            scrollToBottom();
        }

        function scrollToBottom() {
            consoleBody.scrollTop = consoleBody.scrollHeight;
        }

        function resetTerminal() {
            consoleOutput.textContent = initialText;
            cmdInput.value = "";
            scrollToBottom();
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            clock.textContent = hours + ':' + minutes + ' ' + ampm;
        }

        function hideWindow(reset = false) {
            win.style.display = "none";
            taskbarApp.classList.remove("active");
            if (reset) {
                resetTerminal();
            }
        }

        function bringOnScreen() {
            if (win.style.display === "none") return;
            
            let rect = win.getBoundingClientRect();
            let maxX = window.innerWidth - win.offsetWidth;
            let maxY = window.innerHeight - win.offsetHeight - 30;
            
            let newX = Math.max(0, Math.min(rect.left, maxX));
            let newY = Math.max(0, Math.min(rect.top, maxY));
            
            win.style.left = newX + "px";
            win.style.top = newY + "px";
            win.style.transform = "none";
        }

        function showWindow() {
            win.style.display = "block";
            taskbarApp.classList.add("active");
            bringOnScreen();
            cmdInput.focus();
        }

        setInterval(updateClock, 1000);

        window.addEventListener('load', () => {
            scrollToBottom();
            updateClock();
        });

        consoleBody.addEventListener('click', () => {
            cmdInput.focus();
        });

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const rawInput = cmdInput.value;
                const trimmedInput = rawInput.trim();
                
                print(promptText.textContent + rawInput);

                if (trimmedInput !== "") {
                    const cmd = trimmedInput.toLowerCase();

                    if (cmd === 'cls' || cmd === 'clear') {
                        consoleOutput.textContent = "";
                    } else if (cmd === 'exit') {
                        hideWindow(true);
                        return;
                    } else {
                        print(`'${cmd}' is not recognized as an internal or external command,`);
                        print("operable program or batch file.");
                        print("");
                    }
                }

                cmdInput.value = "";
                scrollToBottom();
            }
        });

        btnMinimize.addEventListener("click", () => hideWindow(false));
        btnClose.addEventListener("click", () => hideWindow(true));

        taskbarApp.addEventListener("click", () => {
            if (win.style.display === "none") {
                showWindow();
            } else {
                hideWindow(false);
            }
        });

        titleBar.addEventListener("mousedown", (e) => {
            if (e.target.closest('.title-bar-controls')) return;

            isDragging = true;
            winRect = win.getBoundingClientRect();
            
            startX = e.clientX - winRect.left;
            startY = e.clientY - winRect.top;

            outline.style.width = winRect.width + "px";
            outline.style.height = winRect.height + "px";
            outline.style.left = winRect.left + "px";
            outline.style.top = winRect.top + "px";
            
            outline.style.display = "block";
            
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            
            let newX = e.clientX - startX;
            let newY = e.clientY - startY;

            outline.style.left = newX + "px";
            outline.style.top = newY + "px";
        });

        document.addEventListener("mouseup", () => {
            if (!isDragging) return;
            isDragging = false;

            outline.style.display = "none";

            let finalX = parseInt(outline.style.left);
            let finalY = parseInt(outline.style.top);

            win.style.left = finalX + "px";
            win.style.top = finalY + "px";
            win.style.transform = "none";
        });
    </script>
</body>
</html>
